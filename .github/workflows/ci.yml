name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC Debug
            os: windows-latest
            build_type: Debug
            cxx_standard: 17

          - name: Windows MSVC Release
            os: windows-latest
            build_type: Release
            cxx_standard: 17

          # Before C++17, string_view and optional come from string-view-lite and optional-lite. MSVC has no C++11
          # mode, so C++14 is its oldest.
          - name: Windows MSVC C++14
            os: windows-latest
            build_type: Release
            cxx_standard: 14

          - name: Linux GCC C++11
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 11
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

          - name: Linux GCC C++14
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 14
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

          - name: Linux GCC C++17
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 17
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

          - name: Linux GCC C++20
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 20
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

          - name: Linux GCC C++23
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 23
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

          # Sanitizers on sqlitexx's C++ code only: SQLite itself calls functions through cast pointers, which
          # -fsanitize=function would report.
          - name: Linux Clang ASan+UBSan
            os: ubuntu-latest
            build_type: Debug
            cxx_standard: 17
            cmake_args: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

          - name: Linux Clang C++11 ASan+UBSan
            os: ubuntu-latest
            build_type: Debug
            cxx_standard: 11
            cmake_args: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

          # sqlitexx never throws, so it must build and work with exceptions switched off: with expected-lite (C++17)
          # and with std::expected (C++23) on each compiler family, and with every backport on GCC (C++11). MSVC switches use '-', which it
          # accepts like '/', so Git Bash on the Windows runner does not rewrite them as paths.
          - name: Windows MSVC no exceptions C++17
            os: windows-latest
            build_type: Release
            cxx_standard: 17
            cmake_args: '"-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHs-c- -D_HAS_EXCEPTIONS=0"'

          - name: Windows MSVC no exceptions C++23
            os: windows-latest
            build_type: Release
            cxx_standard: 23
            cmake_args: '"-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHs-c- -D_HAS_EXCEPTIONS=0"'

          - name: Linux GCC no exceptions C++11
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 11
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=-fno-exceptions

          - name: Linux GCC no exceptions C++17
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 17
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=-fno-exceptions

          - name: Linux GCC no exceptions C++23
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 23
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=-fno-exceptions

          - name: Linux GCC system SQLite
            os: ubuntu-latest
            build_type: Release
            cxx_standard: 17
            system_sqlite: true
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DSQLITEXX_USE_SYSTEM_SQLITE=ON

          - name: macOS AppleClang
            os: macos-latest
            build_type: Release
            cxx_standard: 17

    steps:
      - uses: actions/checkout@v5

      - name: Install system SQLite
        if: matrix.system_sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DSQLITEXX_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  # Installs sqlitexx and builds tests/install, a separate project that finds it with find_package like a user would
  install:
    name: Install ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest

          - name: Linux GCC
            os: ubuntu-latest
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            consumer_args: -DCMAKE_CXX_COMPILER=g++

          # The bundled string-view-lite and optional-lite are installed with the package
          - name: Linux GCC C++11
            os: ubuntu-latest
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=11
            consumer_args: -DCMAKE_CXX_COMPILER=g++

          # The package has to find the system SQLite again, and pass C++23 on for std::expected
          - name: Linux GCC system SQLite C++23
            os: ubuntu-latest
            system_sqlite: true
            cmake_args: >-
              -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
              -DCMAKE_CXX_STANDARD=23 -DSQLITEXX_USE_SYSTEM_SQLITE=ON
            consumer_args: -DCMAKE_CXX_COMPILER=g++

          - name: macOS AppleClang
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install system SQLite
        if: matrix.system_sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build and install sqlitexx
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSQLITEXX_BUILD_TESTS=OFF -DSQLITEXX_BUILD_EXAMPLES=OFF ${{ matrix.cmake_args }}
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix "${{ runner.temp }}/prefix"

      - name: Build and run a project using the installed package
        shell: bash
        run: |
          cmake -S tests/install -B consumer -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/prefix" ${{ matrix.consumer_args }}
          cmake --build consumer --config Release
          ctest --test-dir consumer --build-config Release --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same clang-format version as Visual Studio's, so local formatting and CI agree
      - name: Install clang-format
        run: pipx install clang-format==22.1.3

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.hpp' '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
